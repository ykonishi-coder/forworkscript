# =====================================================================
# 目標管理エージェント - 設定ファイル
# =====================================================================

version: 1

user_type: minimal  # trial / minimal / full

# =====================================================================
# フレームワーク
# =====================================================================
frameworks:
  # 使用するフレームワーク（複数選択可・混在OK）
  enabled:
    - smart  # smart / okr / kpi / gtd / simple

  # デフォルト（set-goal 時に指定がない場合）
  default: smart

# =====================================================================
# 分類
# =====================================================================
classification:
  # unified / work_personal / by_project
  mode: unified

  # work_personal モード時のフォルダ
  work_folder: "goals/work"
  personal_folder: "goals/personal"

# =====================================================================
# レビュー頻度
# =====================================================================
reviews:
  weekly:
    enabled: true
    day: monday
    time: "08:30"
  monthly:
    enabled: true
    day_of_month: 1
    time: "09:00"
  quarterly:
    enabled: false

# =====================================================================
# ダッシュボード設定
# =====================================================================
dashboard:
  # 表示する目標数の上限
  max_items: 10

  # ステータス判定しきい値（達成率 %）
  status:
    healthy: 70      # 70% 以上: 順調
    caution: 40      # 40-70%: 要注意
    # 40% 未満: 危険

  # 期限切れアラートしきい値（日）
  expire_warning_days: 7

# =====================================================================
# 外部ツール連携
# =====================================================================
integrations:
  # none / manual / todoist / linear / notion / asana / jira / custom
  task_tool: none

  # 書き込み権限（true にすると、承認フロー後の書き込みが可能）
  allow_write: false

# =====================================================================
# 他エージェント連携
# =====================================================================
peer_agents:
  secretary:
    enabled: false
    config_path: "./.secretary"

  meeting_supporter:
    enabled: false
    config_path: "./.meeting-supporter"

  spreadsheet_operator:
    enabled: false
    config_path: "./.spreadsheet-operator"

  report_writer:
    enabled: false
    config_path: "./.report-writer"

# =====================================================================
# 連携情報の最新調査ログ
# =====================================================================
integration_research:
  todoist:
    date: ""
    summary: ""
  linear:
    date: ""
    summary: ""
  notion:
    date: ""
    summary: ""

# =====================================================================
# 保存先
# =====================================================================
workspace:
  base_path: "./"

  folders:
    goals: "goals"
    reviews: "reviews"
    reminders: "reminders"

# =====================================================================
# スケジュール
# =====================================================================
schedule:
  mode: manual_only  # manual_only / weekly_prep / monthly_prep / quarterly_prep
  cron_expression: ""
  timezone: "Asia/Tokyo"

# =====================================================================
# プライバシー設定
# =====================================================================
privacy:
  # プライベート目標を仕事用ダッシュボードから除外
  exclude_personal_from_work_view: true

  # 機密マーカー（[CONFIDENTIAL] 等）付き目標の特別扱い
  confidential_marker: "[CONFIDENTIAL]"

  # 一定期間経過後に古いデータを削除（日数、0 で無効）
  delete_after_days: 0

# =====================================================================
# セキュリティ
# =====================================================================
security:
  # 外部ツールへの自動書き込み禁止（変更不可扱い）
  never_auto_write_external: true

  # 他エージェント連携時は毎回承認
  require_peer_consent: true

  # 目標ファイル過去ログの改変禁止（追記のみ）
  append_only_history: true

  auto_stop_after_errors: 3

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  include_sensitive_content: false

# =====================================================================
# リマインド設定
# set-goal でユーザーが選んだリマインドタイミングを記録する。
# 通知は出さず、scheduled-run で準備ファイルを生成するためだけに使う。
# =====================================================================
reminders:
  mode: ""          # weekend / month_end / quarter_end / custom / none
  custom_date: ""   # mode: custom のときの日付
