# =====================================================================
# 採用支援エージェント - 設定ファイル
# =====================================================================
# ⚠️ このファイルは個人情報保護に関わる重要な設定です
# 必ず .gitignore に追加してください
# =====================================================================

version: 1

user_type: minimal  # trial / minimal / full

# =====================================================================
# プライバシー設定（最重要）
# =====================================================================
privacy:
  # マスキングレベル
  # maximum  = 氏名・連絡先・住所・顔写真・家族情報すべてマスキング
  # strict   = 連絡先・顔写真をマスキング、氏名は残す
  # standard = 最小限のマスキング（設定による）
  masking_level: maximum

  # マスキング対象
  mask_fields:
    - full_name       # 氏名
    - address         # 住所
    - phone           # 電話番号
    - email           # メール
    - photo           # 顔写真
    - family          # 家族構成
    - birthplace      # 出身地・本籍
    - family_income   # 家族収入
    - personal_bank   # 個人財務情報

  # 原文保存
  keep_original_documents: false  # 原文は保存しない（評価サマリのみ）

  # 自動削除ポリシー
  cleanup:
    enabled: true
    delete_after_days: 90  # 選考終了後90日で削除
    notify_before_delete: true

# =====================================================================
# 現在使っているツール
# =====================================================================
current_tools:
  # 参考情報（連携するわけではない）
  - manual  # excel / notion / greenhouse / lever / workday / manual / 他

# =====================================================================
# 連携方式（デフォルトは manual）
# =====================================================================
integration:
  # manual / csv / api / mcp
  method: manual

  # 自動連携使う場合のみ
  ats_tool: ""
  research_date: ""
  research_summary: ""

# =====================================================================
# 安全装置（自動連携時）
# =====================================================================
safety:
  api_safety:
    max_candidates_per_session: 10
    require_user_confirm_before_fetch: true
    auto_purge_after_process: true
    never_auto_write_to_ats: true

# =====================================================================
# 評価基準
# =====================================================================
evaluation:
  # 職種別ルーブリックのパス
  rubrics:
    engineer: ""  # templates/screening-rubric.template.md を参考に作成
    sales: ""
    designer: ""
    # 職種を追加

  # デフォルトの評価観点
  default_criteria:
    - technical_skill
    - problem_solving
    - communication
    - culture_fit
    - growth_potential

# =====================================================================
# 面接設定
# =====================================================================
interview:
  types:
    - first       # 一次
    - second      # 二次
    - final       # 最終
    - casual      # カジュアル面談

  # 面接官リスト（名前のみ、個人情報は避ける）
  interviewers:
    - name: "面接官A"
      role: "EM"
    - name: "面接官B"
      role: "PM"

# =====================================================================
# バイアス防止
# =====================================================================
bias_prevention:
  # advocate の起動タイミング
  # strict   = 全機能で自動
  # standard = 重要なポイントで自動（書類選考・最終判断）
  # relaxed  = 明示的に依頼されたときのみ
  advocate_trigger: standard

# =====================================================================
# 他エージェント連携
# =====================================================================
peer_agents:
  secretary:
    enabled: false
    # 候補者とのメールやり取りを参照（要承認）

  meeting_supporter:
    enabled: false
    # 面接録音/議事録から FB 作成補助

  text_quality_checker:
    enabled: false
    # 求人票の文面チェック

# =====================================================================
# 法令遵守設定
# =====================================================================
compliance:
  # 組織の個人情報保護規程名
  organization_policy: ""

  # 応募者への利用目的通知文言
  usage_purpose_notice: |
    本選考では、書類審査・面接評価の一部で AI 支援ツールを使用します。
    AI による自動判定は行わず、最終判断は採用担当者が行います。
    収集した情報は選考目的のみに使用し、選考終了後は適切に削除します。

  # 応募者の同意取得状況
  consent_obtained: false  # 必ず true にしてから運用

  # 要配慮個人情報の取扱
  handle_sensitive_info: false  # 原則 false

# =====================================================================
# 保存先
# =====================================================================
workspace:
  base_path: "./.hiring-assistant"

  folders:
    candidates: "candidates"
    screening: "screening"
    interviews: "interviews"
    comparisons: "comparisons"

# =====================================================================
# セキュリティ
# =====================================================================
security:
  # 候補者情報の外部送信禁止（Claude API 経由処理は除く）
  never_external_send: true

  # 他エージェント連携は毎回承認
  require_peer_consent: true

  # 書き込み操作は毎回承認
  require_write_consent: true

  # 認証情報の扱い
  # スキル設定ファイルには保存しない（環境変数 or OSキーチェーン）
  never_store_credentials: true

  auto_stop_after_errors: 3

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  # 個人情報保護のため、候補者詳細はログに残さない
  include_sensitive_content: false

  # 操作ログ（誰が何を処理したか）
  audit_log:
    enabled: true
    path: "./audit.log"
