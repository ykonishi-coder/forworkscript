# =====================================================================
# スライド デザインテーマ
# =====================================================================
# designer が設定し、builder がこれを読み取って実ファイルに適用する

# テーマ種別
# simple_clean / corporate / creative / academic / product / custom
tendency: simple_clean

# =====================================================================
# 配色
# =====================================================================
colors:
  # 主要色
  primary: "#1F2937"      # 濃いグレー系（見出し・強調）
  secondary: "#6B7280"    # ミッドグレー（補助・ラベル）
  accent: "#3B82F6"       # 青系（重要な強調・CTA）

  # 背景
  background: "#FFFFFF"
  background_alt: "#F9FAFB"  # セクション区切り等

  # テキスト
  text_primary: "#1F2937"
  text_secondary: "#6B7280"
  text_on_accent: "#FFFFFF"

  # 状態色
  success: "#10B981"
  warning: "#F59E0B"
  danger: "#EF4444"
  info: "#3B82F6"

# =====================================================================
# フォント
# =====================================================================
fonts:
  # 日本語
  heading_jp: "Noto Sans JP Bold"
  body_jp: "Noto Sans JP Regular"

  # 英語
  heading_en: "Inter Bold"
  body_en: "Inter Regular"

  # コード表示
  code: "JetBrains Mono"

# =====================================================================
# フォントサイズ
# =====================================================================
font_sizes:
  # プレゼン投影前提のサイズ（pt）
  title: 48
  subtitle: 32
  heading: 28
  subheading: 22
  body: 20
  caption: 16

# =====================================================================
# レイアウト
# =====================================================================
layout:
  # ヘッダ・フッタ
  has_header: true
  has_footer: true
  has_page_number: true

  # ヘッダ内容
  header:
    left: "logo"     # logo / text / none
    right: "page_number"

  # フッタ内容
  footer:
    left: "date"
    right: "presenter_name"

  # 余白（%）
  margin_top: 10
  margin_bottom: 10
  margin_left: 8
  margin_right: 8

  # コンテンツ領域の余白
  padding_between_elements: 1.5  # rem 相当

# =====================================================================
# アクセシビリティ
# =====================================================================
accessibility:
  # コントラスト比: WCAG AA 以上を推奨
  min_contrast_ratio: 4.5

  # 色だけで情報を伝えない
  rely_on_color_only: false

  # 代替テキスト
  require_alt_text: true

# =====================================================================
# ブランドガイドライン（会社・チーム指定があれば上書き）
# =====================================================================
brand:
  logo_path: ""
  logo_position: "top_left"

  # ブランド色の上書き（あれば）
  brand_primary: ""
  brand_secondary: ""

  # 指定フォント（あれば）
  brand_font: ""

# =====================================================================
# アニメーション・トランジション
# =====================================================================
animation:
  # スライド間トランジション
  # none / fade / slide / zoom
  transition: none

  # 要素の登場アニメーション
  element_animation: false
