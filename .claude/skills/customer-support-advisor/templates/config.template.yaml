# =====================================================================
# Customer Support Advisor - 設定ファイル
# =====================================================================

version: 1

user_type: minimal

# =====================================================================
# ビジネス・現状
# =====================================================================
business:
  type: ""  # btob / btoc / ec / saas / btob2c
  industry: ""
  customer_base: ""

# =====================================================================
# 現状のチャネル
# =====================================================================
channels:
  email: false
  phone: false
  chat_web: false
  line: false
  x_twitter: false
  form: false
  in_store: false
  sns_dm: false

# =====================================================================
# 現状のツール
# =====================================================================
current_tools:
  management: ""  # excel / gmail / zendesk / freshdesk / notion / none
  crm: ""
  help_page: false
  knowledge_base: false
  chatbot: false

# =====================================================================
# 規模
# =====================================================================
scale:
  monthly_inquiries: 0
  team_size: 0
  specialists: 0  # 専任
  part_timers: 0  # 兼任

# =====================================================================
# 主な課題
# =====================================================================
challenges:
  - ""  # slow_response / personalized / repetitive / scattered / quality / burnout / cost / csat_low / other

# =====================================================================
# 目標
# =====================================================================
goals:
  short_term: ""   # 1-3ヶ月
  mid_term: ""     # 3-12ヶ月
  ideal_state: ""

# =====================================================================
# 予算
# =====================================================================
budget:
  monthly_tools: 0
  initial_setup: 0

# =====================================================================
# すぐできる改善実績
# =====================================================================
quick_wins_history: []

# =====================================================================
# 連携情報の最新調査ログ
# =====================================================================
integration_research:
  helpdesk_tools:
    date: ""
    summary: ""
  chatbot:
    date: ""
    summary: ""

# =====================================================================
# 他エージェント連携
# =====================================================================
peer_agents:
  secretary: { enabled: false }
  text_quality_checker: { enabled: false }
  spreadsheet_operator: { enabled: false }
  report_writer: { enabled: false }
  marketing_strategist: { enabled: false }

# =====================================================================
# プライバシー
# =====================================================================
privacy:
  mask_customer_info: true
  never_store_customer_data: true  # 顧客データはローカルにも保存しない

  cleanup:
    enabled: true
    delete_after_days: 90

# =====================================================================
# 保存先
# =====================================================================
workspace:
  base_path: "./.customer-support-advisor"
  folders:
    current_state: "current-state"
    quick_wins: "quick-wins"
    faqs: "faqs"
    templates: "templates"
    knowledge_base: "knowledge-base"
    reports: "reports"

# =====================================================================
# セキュリティ
# =====================================================================
security:
  never_external_send: true
  require_peer_consent: true
  auto_stop_after_errors: 3

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  include_sensitive_content: false
