# =====================================================================
# Marketing Strategist - 設定ファイル
# =====================================================================

version: 1

user_type: minimal

# =====================================================================
# 事業・業界
# =====================================================================
business:
  # btob / btoc / btob2c / ec / saas / content / other
  type: ""
  industry: ""

# =====================================================================
# 現状のマーケ活動
# =====================================================================
current_activities:
  active_channels: []
  # seo / sem / sns / content / email / ads / influencer / pr / events / direct

# =====================================================================
# 目的
# =====================================================================
goals:
  primary: []
  # awareness / leads / cvr / ltv / branding / product_promo / competition

# =====================================================================
# サポートレベル
# =====================================================================
support_level:
  # level1 (戦略相談)
  # level2 (データ貼付分析)
  # level3 (API連携・上級)
  current: level1

# =====================================================================
# ターゲット
# =====================================================================
target:
  personas: []
  segments: []

# =====================================================================
# ブランド情報
# =====================================================================
brand:
  name: ""
  positioning: ""
  tone: ""

# =====================================================================
# 予算・リソース
# =====================================================================
budget:
  monthly_marketing: 0
  monthly_ads: 0
  team_size: 0
  can_outsource: false

# =====================================================================
# 現状ツール
# =====================================================================
current_tools:
  analytics: []  # ga4 / adobe_analytics / 他
  ma: []         # hubspot / marketo / pardot / satori / 他
  ads: []        # google_ads / meta_ads / 他
  crm: []        # salesforce / hubspot / 他
  sns_mgmt: []
  seo: []
  cms: []

# =====================================================================
# KPI
# =====================================================================
kpi:
  primary: []
  current_values: {}
  target_values: {}

# =====================================================================
# 連携（レベル3）
# =====================================================================
integration:
  google_ads: false
  meta_ads: false
  ga4: false
  ma_tool: false

# =====================================================================
# 他エージェント連携
# =====================================================================
peer_agents:
  bizdev_strategist:
    enabled: false
  design_consultant:
    enabled: false
  slide_maker:
    enabled: false
  report_writer:
    enabled: false
  text_quality_checker:
    enabled: false

# =====================================================================
# 連携情報の最新調査ログ
# =====================================================================
integration_research:
  google_ads:
    date: ""
    summary: ""
  meta_ads:
    date: ""
    summary: ""
  ma_tools:
    date: ""
    summary: ""

# =====================================================================
# プライバシー
# =====================================================================
privacy:
  masking_level: strict

  mask_fields:
    - customer_data
    - ad_spend_details
    - conversion_details

  cleanup:
    enabled: true
    delete_after_days: 180

# =====================================================================
# 保存先
# =====================================================================
workspace:
  base_path: "./.marketing-strategist"
  folders:
    projects: "projects"
    personas: "personas"
    strategies: "strategies"
    campaigns: "campaigns"
    reports: "reports"

# =====================================================================
# セキュリティ
# =====================================================================
security:
  never_external_send: true
  require_peer_consent: true
  auto_stop_after_errors: 3

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  include_sensitive_content: false
