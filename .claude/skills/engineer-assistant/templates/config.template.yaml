# =====================================================================
# Engineer Assistant - 設定ファイル
# =====================================================================

version: 1

user_type: minimal

# =====================================================================
# サポートレベル
# =====================================================================
support_level:
  # level1 (相談・コード貼り付け)
  # level2 (ローカルプロジェクト連携)
  # level3 (GitHub/IDE/CI連携・上級)
  current: level1

# =====================================================================
# 経験レベル
# =====================================================================
user_experience:
  # beginner / intermediate / advanced / non_engineer
  level: intermediate

# =====================================================================
# 技術スタック
# =====================================================================
tech_stack:
  languages: []
  frameworks: []
  databases: []
  infrastructure: []

# =====================================================================
# 開発環境
# =====================================================================
environment:
  os: ""  # macOS / linux / windows
  ide: ""  # vscode / jetbrains / vim / emacs

# =====================================================================
# 連携
# =====================================================================
integration:
  # レベル3
  github:
    enabled: false
    mcp_enabled: false
  gitlab:
    enabled: false
  ci:
    type: ""  # github_actions / circleci / jenkins / gitlab_ci

# =====================================================================
# セキュリティ設定
# =====================================================================
security:
  scan_for_hardcoded_secrets: true
  vulnerability_scan: true
  dependency_monitoring: true
  never_store_credentials: true
  auto_stop_after_errors: 3

# =====================================================================
# コード規約
# =====================================================================
code_standards:
  style_guide: ""  # pep8 / airbnb / google / team_custom
  linter: ""
  formatter: ""

# =====================================================================
# 他エージェント連携
# =====================================================================
peer_agents:
  report_writer:
    enabled: false
  slide_maker:
    enabled: false
  text_quality_checker:
    enabled: false

# =====================================================================
# 連携情報の最新調査ログ
# =====================================================================
integration_research:
  github:
    date: ""
    summary: ""

# =====================================================================
# 保存先
# =====================================================================
workspace:
  base_path: "./.engineer-assistant"
  folders:
    projects: "projects"
    reviews: "reviews"
    adrs: "adrs"

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  include_sensitive_content: false
