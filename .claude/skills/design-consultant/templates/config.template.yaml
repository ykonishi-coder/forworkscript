# =====================================================================
# Design Consultant - 設定ファイル
# =====================================================================

version: 1

user_type: minimal

# =====================================================================
# サポートレベル（最重要）
# =====================================================================
support_level:
  # level1 (基礎・案出し・推奨)
  # level2 (中級・画像生成AI連携)
  # level3 (上級・デザインツール連携)
  current: level1

# =====================================================================
# 経験レベル
# =====================================================================
user_experience:
  # beginner / intermediate / professional / requester
  level: beginner

# =====================================================================
# 主な用途
# =====================================================================
use_cases:
  - web_lp
  # ロゴ・SNS・プレゼン・印刷・UI/UX・パッケージ 等

# =====================================================================
# ブランド情報
# =====================================================================
brand:
  name: ""
  primary_color: ""
  secondary_color: ""
  heading_font: ""
  body_font: ""
  tone: ""
  has_guideline: false
  guideline_path: ""

# =====================================================================
# デザインツール（レベル3の場合）
# =====================================================================
design_tools:
  canva:
    use: false
    plan: ""  # free / pro / teams
  adobe:
    use: false
    tools: []  # photoshop / illustrator / indesign / xd
  figma:
    use: false
    plan: ""  # free / professional / organization
  sketch:
    use: false

# =====================================================================
# 連携方式
# =====================================================================
integration:
  # manual / api / mcp
  method: manual

  # レベル2: 画像生成AI連携
  image_prompt_integration: false

  # レベル3: デザインツール連携
  canva_api: ""
  adobe_api: ""
  figma_api: ""

# =====================================================================
# アクセシビリティ
# =====================================================================
accessibility:
  # wcag_aa / wcag_aaa / internal_only
  standard: wcag_aa

# =====================================================================
# ターゲット
# =====================================================================
target_audience:
  # professional / general / kids / seniors
  default: general

# =====================================================================
# 他エージェント連携
# =====================================================================
peer_agents:
  image_prompt_generator:
    enabled: false
  slide_maker:
    enabled: false
  text_quality_checker:
    enabled: false

# =====================================================================
# 連携情報の最新調査ログ
# =====================================================================
integration_research:
  canva:
    date: ""
    summary: ""
  adobe:
    date: ""
    summary: ""
  figma:
    date: ""
    summary: ""

# =====================================================================
# 保存先
# =====================================================================
workspace:
  base_path: "./.design-consultant"
  folders:
    projects: "projects"
    brand_guidelines: "brand-guidelines"
    palettes: "palettes"

# =====================================================================
# セキュリティ
# =====================================================================
security:
  never_external_send: true
  require_peer_consent: true
  auto_stop_after_errors: 3

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  include_sensitive_content: false
