# =====================================================================
# MTGサポーター - 設定ファイル
# ---------------------------------------------------------------------
# このファイルはあなたのPC内にのみ保存されます。
# 外部サーバーに送られることも、Claudeの学習に使われることもありません。
# git リポジトリに置く場合は、.gitignore への追加を強く推奨します。
# 機密度の高い会議情報を扱うため、特に注意してください。
# =====================================================================

version: 1

user_type: minimal  # trial / minimal / full

# =====================================================================
# 保存先
# =====================================================================
output_dir: "./meetings"

# =====================================================================
# 入力方式
# =====================================================================
input:
  # paste_text / transcription_tool_export / local_recording / mcp
  mode: paste_text

  # 文字起こしツール連携（有効時のみ使用）
  transcription_tool: ""  # otter_ai / zoom / teams / whisper_api / custom
  transcription_integration: ""  # mcp / api / manual

# =====================================================================
# 議事録フォーマット
# =====================================================================
format:
  # standard / simple / detailed
  template: standard

  # 原文文字起こしを議事録ファイルに含めるか
  # 機密保護のためデフォルト false（別ファイルに保存したい場合は別途設定）
  include_transcript: false

  # 機密マーカー付き議事録の扱い
  confidential_marker: "[CONFIDENTIAL]"
  confidential_handling: separate  # separate / same_folder

# =====================================================================
# 検索設定
# =====================================================================
search:
  # new_only: MTGサポーター生成分のみ
  # all: 下記の追加フォルダも含む
  scope: new_only

  # 追加の検索対象フォルダ（scope: all の場合のみ）
  additional_dirs: []

  # 検索結果の最大件数
  max_results: 10

# =====================================================================
# To-Do 追跡
# =====================================================================
todo:
  # 追跡対象期間（日数）
  lookback_days: 30

  # 期限超過の警告閾値（日）
  overdue_warning_days: 3

  # リマインド下書き生成を有効化
  enable_reminder_drafts: true

  # リマインド下書きの保存先
  reminder_output_dir: "./reminders"

# =====================================================================
# タスク管理ツール連携
# =====================================================================
task_management:
  # none / linear / notion / todoist / custom
  tool: none

  # none / api / mcp / export_import
  integration: none

# =====================================================================
# 連携情報の最新調査ログ
# =====================================================================
integration_research:
  transcription:
    date: ""
    summary: ""
  task_management:
    date: ""
    summary: ""

# =====================================================================
# スケジュール（定期実行）
# =====================================================================
schedule:
  mode: manual_only  # manual_only / daily_summary / weekly_summary
  cron_expression: ""
  timezone: "Asia/Tokyo"

# =====================================================================
# セキュリティ
# =====================================================================
security:
  # 議事録を外部送信しない（変更不可扱い）
  never_external_send: true

  # 参加者への自動通知禁止（ドラフトまで）
  never_auto_notify: true

  # 機密マーカー付き議事録の無許可アクセス禁止
  require_explicit_confidential_access: true

  auto_stop_after_errors: 3

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  include_sensitive_content: false
