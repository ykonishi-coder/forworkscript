# =====================================================================
# スプレッドシートサポーター - 設定ファイル
# ---------------------------------------------------------------------
# このファイルはあなたのPC内にのみ保存されます。
# 認証情報・トークンは絶対にここに書かない（OS キーチェーンや
# 環境変数、スクリプトプロパティで管理する）。
# =====================================================================

version: 1

user_type: minimal  # trial / minimal / full

# =====================================================================
# 対象ツール
# =====================================================================
target:
  # google_sheets / excel / both
  tool: google_sheets

# =====================================================================
# 連携方式
# =====================================================================
integration:
  # google_sheets 用
  # manual / gas_web_app / sheets_api / mcp
  google_sheets: manual
  gas_web_app_url: ""  # gas_web_app 方式時のみ。URL のみ記載（トークンは別管理）

  # excel 用
  # manual / file_exchange / office_scripts / vba
  excel: manual

# =====================================================================
# 操作の安全設定
# =====================================================================
safety:
  # 書き込み操作前に必ずドライラン
  always_dry_run: true

  # 書き込み操作前に必ずバックアップ作成
  always_backup: true

  # 100行以上の変更は追加確認
  confirm_bulk_changes: true
  bulk_threshold_rows: 100

  # 列全体・シート全体の削除は特に厳重確認
  strict_destructive_confirm: true

  # 定期実行での書き込みを禁止（読み取り・レポートのみ許可）
  no_write_in_scheduled: true

# =====================================================================
# 権限制限
# =====================================================================
permissions:
  # 操作を許可するスプレッドシートIDのリスト
  # GAS Web App 側の ALLOWED_SHEET_IDS と同期させる
  allowed_sheet_ids: []

  # 外部スプレッドシートへの書き込みを禁止
  deny_external_sheets: true

  # メール送信機能（外部 API 呼び出し）を持つスクリプト生成を禁止
  deny_email_in_scripts: true

# =====================================================================
# 関数生成の好み
# =====================================================================
formula:
  # デフォルトで3案（可読性 / 堅牢性 / モダン）を提示
  default_variants: 3

  # モダン関数（XLOOKUP / LAMBDA / LET）の使用可否
  # Google Sheets: ほぼ対応
  # Excel 2021+: 対応
  # 旧 Excel: 未対応
  allow_modern_functions: true

  # エラーハンドリング（IFERROR / IFNA）を堅牢性版に含める
  include_error_handling: true

# =====================================================================
# スクリプト生成の好み
# =====================================================================
script:
  # 認証情報はコード直書きせず PropertiesService で管理
  # （この挙動は変更不可扱い）
  use_properties_service: true

  # 外部 API 呼び出しを含める場合、追加確認を取る
  confirm_external_api: true

  # トリガー設定を自動で行うか、手順案内のみか
  trigger_setup: guide_only  # guide_only / offer_to_setup

# =====================================================================
# 連携情報の最新調査ログ
# =====================================================================
integration_research:
  google_sheets:
    date: ""
    summary: ""
  excel:
    date: ""
    summary: ""

# =====================================================================
# スケジュール（読み取り・レポートのみ）
# =====================================================================
schedule:
  mode: manual_only
  cron_expression: ""
  timezone: "Asia/Tokyo"

# =====================================================================
# ログ
# =====================================================================
logging:
  path: "./logs.txt"
  level: info
  include_sensitive_content: false
